on:
    push:
        branches:
            - main
            - "realease/**"
        paths:
            - "src/**"
    pull_request:
        branches:
            - main
            - "realease/**"
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7
            
            - name: run tests
              working-directory: src  # just to tell the runer where the package json file is
              run: npm test
