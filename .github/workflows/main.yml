name: First GitHub Actions workflow

on:
  push:
    branches:
      - main
jobs:
  example-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print a greeting msg
        run: echo "Welcome, this is my first GitHub Actions workflow" 
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: list repo files
        run: ls -la
